<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self';">
        <title>SimpleMemo</title>
        <link rel="stylesheet" href="css/index.css">
        <script src="js/mousetrap.js" charset="utf-8"></script>
        <script src="js/index.js" charset="utf-8"></script>
    </head>
    <body>
        <button type="button" id="sheet_button">1</button>
        <button type="button" id="save_button">Save</button>
        <input type="text" id="filename_textbox_0" class="mousetrap" spellcheck="false">
        <input type="text" id="filename_textbox_1" class="mousetrap" spellcheck="false">
        <input type="text" id="filename_textbox_2" class="mousetrap" spellcheck="false">

        <!-- 非表示はdisplay:none, visiblity:hidden, hidden で検討する（速度、スクロールバーなどを考慮 -->
        <textarea spellcheck="false" class="mousetrap" id="textarea_0"></textarea>
        <textarea spellcheck="false" class="mousetrap" id="textarea_1"></textarea>
        <textarea spellcheck="false" class="mousetrap" id="textarea_2"></textarea>
        <div id="character_count_statusbar" class="is-hidden">
            <span id="character_count_text">文字数: 0 / 選択: 0</span>
        </div>
    </body>
</html>
